# Builds the site and publishes it to GitHub Pages.
#
# MANUAL ONLY. This workflow has no push trigger on purpose: publishing is an
# authorisation-gated action for this project, so no push or merge may
# republish the public site as a side effect. It runs only when a human starts
# it from the Actions tab (or via the API).
#
# Production launch has not been approved. Adding a `push` trigger — for `main`
# or any other branch — is itself a deployment decision and needs explicit
# authorisation first. See CLAUDE.md, "Actions requiring explicit authorisation".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
